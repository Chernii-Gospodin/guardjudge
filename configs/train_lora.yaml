# LoRA SFT config. Plain LoRA + fp16 by default (T4-compatible). Start values; tune on the validation split.
model_name: Qwen/Qwen3Guard-Gen-4B      # or Qwen/Qwen3Guard-Gen-0.6B for the lightweight smoke run
train_file: data/demo_train.jsonl
eval_file: data/demo_val.jsonl
output_dir: outputs/guardjudge-qwen3guard-4b-lora

# Precision: fp16 (T4/P100-compatible, default) | bf16 (Ampere+ only) | fp32
precision: fp16
# 4-bit base (QLoRA) is an optional fallback if plain LoRA does not fit in VRAM. Off by default.
load_in_4bit: false
# "single" pins the model to one GPU (required for DDP on Kaggle "T4 x2"); "auto" lets accelerate shard.
device_map: single

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

train:
  epochs: 3
  per_device_batch_size: 1
  grad_accum_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  max_length: 1024
  logging_steps: 10
  optim: adamw_torch
  seed: 42
  gradient_checkpointing: true
